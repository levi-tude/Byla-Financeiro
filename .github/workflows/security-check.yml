name: Security check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — gitleaks-action precisa do histórico para
      # resolver ranges tipo SHA^..SHA em push/PR (shallow clone quebra com "unknown revision").
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload SARIF via gitleaks-action falha intermitente (403) em repos individuais;
          # o scan em si continua — só desliga o anexo. Falha real = secret no diff.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Vercel build config (painel, não landing)
        run: node scripts/verify-vercel-config.mjs
      - name: Security config
        run: node scripts/verify-security-config.mjs
